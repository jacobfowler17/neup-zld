[build-system]
requires = ["uv_build > 0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "neup-zld"
version = "0.0.0"
authors = [
  { name="Mike Wagner", email="mjwagner2@wisc.edu" },
  { name="Elizabeth Keith", email="elizabeth.keith@wisc.edu"}
  { name="Jacob Fowler", email="jfowler5@wisc.edu"}
]
description = "NEUP Zero-Liquid Discharge "
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Research",
]
license = "LicenseRef-UW-Madison-proprietary-instructional"
license-files = ["LICENSE"]

dependencies = [
    "numpy",
    "scipy",
    "CoolProp",
    "gurobipy",
    "pandas",
    "matplotlib"
]

[project.urls]
Homepage = "https://github.com/mjwagner2/neup-zld"
Issues = "https://github.com/mjwagner2/neup-zld/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[project.optional-dependencies]
dev = [
]
admin = [
]